# ============================================
# Weddings By Mark - Booking App
# Stack Name: bookingapp
# ============================================
# 
# SETUP:
# 1. Clone repo first:
#    cd /mnt/apps/stacks
#    git clone https://github.com/YOUR-USERNAME/bookingapp.git
#
# 2. Paste this into Dockge as new stack "bookingapp"
# 3. Deploy
# ============================================

version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: bookingapp-mongodb
    restart: unless-stopped
    volumes:
      - /mnt/apps/bookingsappdata/mongodb:/data/db
    networks:
      - bookingapp-network
    environment:
      MONGO_INITDB_DATABASE: weddings_by_mark

  backend:
    build:
      context: /mnt/apps/stacks/bookingapp/backend
      dockerfile: Dockerfile
    container_name: bookingapp-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: weddings_by_mark
      CORS_ORIGINS: https://booking.perfectweddingsbymark.uk,http://localhost:3005
      BACKUP_PATH: /data/backups
      PDF_PATH: /data/backups/invoices
    volumes:
      - /mnt/apps/bookingsappdata/backend:/app/data
      - /mnt/weddings_backups/bookings_data:/data/backups
    networks:
      - bookingapp-network
    ports:
      - "8001:8001"

  frontend:
    build:
      context: /mnt/apps/stacks/bookingapp/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: https://booking.perfectweddingsbymark.uk
    container_name: bookingapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - bookingapp-network
    ports:
      - "3005:80"

networks:
  bookingapp-network:
    driver: bridge
