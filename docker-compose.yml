# Weddings By Mark CRM - Dockge Compose
# Stack Name: weddings-by-mark
# Port: 3005 (frontend) / 8001 (backend API)

version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: wbm-mongodb
    restart: unless-stopped
    volumes:
      - /mnt/apps/appdata/weddings-by-mark/mongodb:/data/db
    networks:
      - wbm-network
    environment:
      - MONGO_INITDB_DATABASE=weddings_by_mark

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wbm-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=weddings_by_mark
      - CORS_ORIGINS=https://booking.perfectweddingsbymark.uk,http://localhost:3005
      - BACKUP_PATH=/data/backups
    volumes:
      - /mnt/apps/appdata/weddings-by-mark/backend:/app/data
      - /mnt/weddings_backups/bookings_data:/data/backups
    networks:
      - wbm-network
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=https://booking.perfectweddingsbymark.uk
    container_name: wbm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - wbm-network
    ports:
      - "3005:80"

networks:
  wbm-network:
    driver: bridge
